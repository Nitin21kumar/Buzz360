services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=buzz360_app
      - POSTGRES_PASSWORD=change_me
      - POSTGRES_DB=buzz360
    volumes:
      - buzzconnect_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buzz360_app -d buzz360"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    expose:
      - "8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://buzz360_app:change_me@postgres:5432/buzz360
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro

  whatsapp-service:
    build: ./whatsapp-service
    expose:
      - "4000"
    env_file:
      - ./whatsapp-service/.env
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://buzz360_app:change_me@postgres:5432/buzz360
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - whatsapp-service

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  buzzconnect_pgdata:
