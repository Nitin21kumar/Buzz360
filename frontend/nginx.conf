server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- security headers ---------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # connect-src includes the API origin at build time via VITE_API_BASE_URL;
    # if you lock this down further, make sure it still allows XHR/fetch to
    # your backend and any Firebase auth domains you use.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed, immutable build assets (Vite outputs content-hashed filenames)
    # can be cached hard; index.html must not be, so a new deploy is always
    # picked up instead of serving a stale shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
